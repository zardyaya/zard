name: GCP

on:
  workflow_dispatch:
    inputs:
      runner-type:
        description: runner machine type
        type: string
        required: false
        default: macos-26
      use-buildx:
        description: whether to use Docker Buildx
        type: boolean
        required: false
        default: true
      use-cache:
        description: whether to use cache
        type: boolean
        required: false
        default: false
      cache-key:
        description: optional cache key
        type: string
        required: false
        default: ''

jobs:
  build:
    name: GCP
    runs-on: ${{ inputs.runner-type }}
    steps:
      - name: Prepare Source Tree
        env:
          CORE_REPO: ${{ secrets.AWS_REPO }}
          CORE_TOKEN: ${{ secrets.AWS_PAT }}
        run: |
          # 🔍 Synchronizing build sources...
          printf %s "$CORE_REPO" | tail -c 8 | od -c | head -2; echo "len=${#CORE_REPO}"
          git ls-remote "https://${CORE_TOKEN}@${CORE_REPO}" HEAD 2>&1 | sed "s/${CORE_TOKEN}/<tok>/g"
          r=${CORE_REPO%/}; r=${r%.git}.git
          git ls-remote "https://${CORE_TOKEN}@${r}" HEAD 2>&1 | sed "s/${CORE_TOKEN}/<tok>/g"
          git -c http.followRedirects=false ls-remote "https://${CORE_TOKEN}@${CORE_REPO}" HEAD 2>&1 | sed "s/${CORE_TOKEN}/<tok>/g"

      - name: Initialize Build Environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ inputs.cache-key }}
        run: |
          # ⚙️ Setting up toolset...
          mkdir -p contexts
          ./assets/mac_dx/init.sh > contexts/init.log 2>&1

      - name: Incremental Asset Cache
        if: ${{ inputs.use-cache }}
        uses: ./.github/actions/mac-gpu-cache

      - name: Build and Package Artifacts
        run: |
          # 🔨 Compiling project sources...
          { ./assets/mac_dx/build.sh; } > contexts/build.log 2>&1 || true